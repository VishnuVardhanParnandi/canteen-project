<!DOCTYPE html>
<html>
<head>
    <title>Item Sales Forecast</title>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f1f5f9;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 14px 28px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 18px;
        }

        th {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

<h2>📈 Predicted Next Day Sales</h2>

<table>
    <tr>
        <th>Item</th>
        <th>Predicted Quantity</th>
    </tr>

    {% for item, qty in rows %}
    <tr>
        <td>{{ item }}</td>
        <td>{{ qty }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
